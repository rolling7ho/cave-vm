name: Bug report
description: Something in cave-vm does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem (for example a VM reaching something its policy denies), do not file it here. Use **Report a vulnerability** on the Security tab instead, as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, starting from a fresh project directory if you can.
      placeholder: |
        1. cave init
        2. cave run
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cave version
      description: Output of `cave --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.0, Apple M3
    validations:
      required: true
  - type: dropdown
    id: distro
    attributes:
      label: Guest image
      options:
        - Debian
        - Ubuntu
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage mode
      options:
        - sealed
        - synced
        - Not sure
  - type: dropdown
    id: network
    attributes:
      label: Network mode
      options:
        - NAT (default)
        - NAT with --net lan
        - Off
        - Not sure
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cave doctor`
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs and other output
      description: Remove credentials and anything private first. Logs should only contain credential names, but check.
      render: shell
