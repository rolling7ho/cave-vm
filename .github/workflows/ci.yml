name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The one required check. Hardware tests that boot a guest are not run
  # here: GitHub-hosted macOS runners probably cannot run Hypervisor.framework
  # guests (ROADMAP.md A7), so they run on the self-hosted Mac (D11).
  check:
    name: check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Prebuilt release binaries, checked against pinned SHA-256 sums.
      # Building them with `cargo install` took about six minutes.
      - name: Install cargo-deny and cargo-audit
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          fetch() { # url sha256 binary-path-in-archive
            curl -sSfL "$1" -o tool.tgz
            echo "$2  tool.tgz" | shasum -a 256 -c -
            tar xzf tool.tgz
            install -m 755 "$3" "$bin/"
            rm -rf tool.tgz "$(dirname "$3")"
          }
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-aarch64-apple-darwin.tar.gz" \
            fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3 \
            cargo-deny-0.20.2-aarch64-apple-darwin/cargo-deny
          fetch "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-aarch64-apple-darwin-v0.22.2.tgz" \
            ec7ca4263769593df4d909be85b94a6b79efa2897be5d2bb8ebd516e823175af \
            cargo-audit-aarch64-apple-darwin-v0.22.2/cargo-audit
          echo "$bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit
