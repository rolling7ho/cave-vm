[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-vm"
version = "1.0.0rc4"
description = "Python client for cave-vm, disposable Linux VMs for coding agents on macOS"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
