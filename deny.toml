# cargo-deny configuration. CI runs `cargo deny check`.
# Adding a dependency still needs Ivan's OK first (AGENTS.md).

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses compatible with Apache-2.0. Extend only with a reason.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # smoltcp and managed (NAT stack, D23): public-domain equivalent.
    "0BSD",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
