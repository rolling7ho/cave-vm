[package]
name = "cave-vm-cli"
description = "The cave command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cave"
path = "src/main.rs"

[dependencies]
cave-vm-mcp = { path = "../mcp" }
cave-vm-proto = { path = "../proto" }
cave-vm-sdk = { path = "../sdk" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
