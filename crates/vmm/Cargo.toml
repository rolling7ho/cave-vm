[package]
name = "cave-vm-vmm"
description = "The cave-vm per-VM process: device models and snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cave-vm-hvf = { path = "../hvf" }
vm-fdt = "0.3.0"
libc = "0.2.190"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "auto-icmp-echo-reply"] }
